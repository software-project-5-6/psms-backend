# ==========================================
# MAJSTRO PSMS - SPRING BOOT CONFIGURATION
# ==========================================

# LOAD LOCAL .env FILE
spring.config.import=optional:file:./.env[.properties]

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.address=0.0.0.0
server.port=${PORT:8080}
spring.application.name=${APP_NAME:backend}

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ==========================================
# HIKARI CONNECTION POOL
# ==========================================
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:300000}
spring.datasource.hikari.initialization-fail-timeout=${HIKARI_INITIALIZATION_FAIL_TIMEOUT:300000}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:1}

# ==========================================
# PGVECTOR CONFIGURATION
# ==========================================
spring.ai.vectorstore.pgvector.initialize-schema=${PGVECTOR_INITIALIZE_SCHEMA:true}
spring.ai.vectorstore.pgvector.dimensions=${PGVECTOR_DIMENSIONS:768}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# ==========================================
# SUPABASE AUTH / STORAGE
# ==========================================
supabase.url=${SUPABASE_URL}
supabase.service.key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:psms-artifacts}

# ==========================================
# SUPABASE JWT VERIFICATION
# ==========================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_URL:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=${SUPABASE_JWT_ALGORITHM:ES256}

# ==========================================
# LOGGING
# ==========================================
logging.level.root=${LOG_ROOT_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_WEB_LEVEL:INFO}
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_HIBERNATE_BINDER_LEVEL:OFF}
logging.level.com.majstro.psms.backend=${LOG_PROJECT_LEVEL:INFO}

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_PATH:/swagger-ui.html}

# ==========================================
# SPRING DEVTOOLS
# ==========================================
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:false}
spring.devtools.livereload.enabled=${DEVTOOLS_LIVERELOAD_ENABLED:false}

# ==========================================
# SENDGRID EMAIL
# ==========================================
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from=${SENDGRID_FROM_EMAIL}
support.recipient.email=${SUPPORT_RECIPIENT_EMAIL:${SENDGRID_FROM_EMAIL:}}

# ==========================================
# FRONTEND / CORS
# ==========================================
app.frontend.url=${FRONTEND_URL:https://psms-e8ak.onrender.com}

# ==========================================
# MULTIPART FILE UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}

# ==========================================
# JINA EMBEDDINGS
# ==========================================
spring.ai.openai.embedding.base-url=${JINA_BASE_URL:https://api.jina.ai}
spring.ai.openai.embedding.api-key=${JINA_API_KEY}
spring.ai.openai.embedding.options.model=${JINA_MODEL:jina-embeddings-v2-base-en}

# ==========================================
# GROQ AI
# ==========================================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}

# ==========================================
# GOOGLE OAUTH / GMAIL
# ==========================================
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URL:https://psms-backend-bw95.onrender.com/oauth/google/callback}
google.scope=${GOOGLE_GMAIL_SCOPE:https://www.googleapis.com/auth/gmail.readonly}
google.auth.uri=${GOOGLE_AUTH_URL:https://accounts.google.com/o/oauth2/v2/auth}

# ==========================================
# ZOOM OAUTH
# ==========================================
zoom.client.id=${ZOOM_CLIENT_ID}
zoom.client.secret=${ZOOM_CLIENT_SECRET}
zoom.redirect.uri=${ZOOM_REDIRECT_URL:https://psms-backend-bw95.onrender.com/oauth/zoom/callback}
zoom.scope=${ZOOM_SCOPES:meeting:read:meeting_chat,meeting:read:meeting_transcript,meeting:read:meeting_audio}
zoom.auth.uri=${ZOOM_AUTH_URL:https://zoom.us/oauth/authorize}