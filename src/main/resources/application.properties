# =========================================================
# SERVER CONFIGURATION
# =========================================================
server.port=${PORT:8080}
spring.application.name=backend
# =========================================================
# DATABASE CONFIGURATION (MySQL)
# =========================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/psms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=Dimuthu14!
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# DATABASE CONFIGURATION (PostGre SQL)
# =========================================================
spring.datasource.url=${DB_URL}?sslmode=require&connectTimeout=300&socketTimeout=300
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=300000
spring.datasource.hikari.initialization-fail-timeout=300000
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# =========================================================
# SUPABASE CONFIGURATION
# =========================================================
supabase.url=${SUPABASE_URL}
supabase.service.key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}
# =========================================================
# SPRING SECURITY (JWT RESOURCE SERVER — Supabase RS256)
# =========================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_URL}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
# =========================================================
# ? LOGGING CONFIGURATION
# =========================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.Majstro.psmsbackend=DEBUG
# =========================================================
# SWAGGER / OPENAPI (Springdoc — Bearer token)
# =========================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# =========================================================
# ? DEVTOOLS (Optional - Auto Restart)
# =========================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
# ===============================
#  EMAIL CONFIG (SendGrid HTTP API)
#  Render blocks outbound SMTP ports (25/465/587), so email is sent via
#  SendGrid's HTTPS API instead of raw SMTP. The "from" address must be
#  verified in SendGrid under Settings > Sender Authentication > Single
#  Sender Verification.
# ===============================
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from=${SENDGRID_FROM_EMAIL}
# ===============================
#  FRONTEND CONFIGURATION
# ===============================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# =========================================================
# JINA AI EMBEDDING CONFIGURATION (OpenAI-compatible, free 1M tokens)
# Overrides the global OpenAI base-url/key just for the embedding client
# =========================================================
spring.ai.openai.embedding.base-url=https://api.jina.ai
spring.ai.openai.embedding.api-key=${JINA_API_KEY}
spring.ai.openai.embedding.options.model=jina-embeddings-v2-base-en
# =========================================================
# GROQ API Key and Endpoint Configuration
# =========================================================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${GROQ_BASE_URL}
spring.ai.openai.chat.options.model=${GROQ_MODEL}
# =========================================================
# Google Cloud Configuration
# =========================================================
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URL}
google.scope=${GOOGLE_GMAIL_SCOPE}
google.auth.uri=https://accounts.google.com/o/oauth2/v2/auth
#==========================================================
# Zoom Cloud Configuration
# =========================================================
zoom.client.id=${ZOOM_CLIENT_ID}
zoom.client.secret=${ZOOM_CLIENT_SECRET}
zoom.redirect.uri=${ZOOM_REDIRECT_URL}
zoom.scope=${ZOOM_SCOPES}
zoom.auth.uri=https://zoom.us/oauth/authorize