
# ==========================================
# LOAD LOCAL .env FILE
# ==========================================
spring.config.import=optional:file:./.env[.properties]

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${PORT}
spring.application.name=${APP_NAME}

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# ==========================================
# HIKARI CONNECTION POOL
# ==========================================
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT}
spring.datasource.hikari.initialization-fail-timeout=${HIKARI_INITIALIZATION_FAIL_TIMEOUT}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE}

# ==========================================
# PGVECTOR
# ==========================================
spring.ai.vectorstore.pgvector.initialize-schema=${PGVECTOR_INITIALIZE_SCHEMA}
spring.ai.vectorstore.pgvector.dimensions=${PGVECTOR_DIMENSIONS}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM}

# ==========================================
# SUPABASE AUTH / STORAGE
# ==========================================
supabase.url=${SUPABASE_URL}
supabase.service.key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}

# ==========================================
# SUPABASE JWT VERIFICATION
# ==========================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWK_URL}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=${SUPABASE_JWT_ALGORITHM}

# ==========================================
# LOGGING
# ==========================================
logging.level.root=${LOG_ROOT_LEVEL}
logging.level.org.springframework.web=${LOG_WEB_LEVEL}
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL_LEVEL}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_HIBERNATE_BINDER_LEVEL}
logging.level.com.majstro.psms.backend=${LOG_PROJECT_LEVEL}

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_ENABLED}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_PATH}

# ==========================================
# SPRING DEVTOOLS
# ==========================================
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED}
spring.devtools.livereload.enabled=${DEVTOOLS_LIVERELOAD_ENABLED}

# ==========================================
# SENDGRID EMAIL
# ==========================================
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from=${SENDGRID_FROM_EMAIL}
support.recipient.email=${SUPPORT_RECIPIENT_EMAIL:${SENDGRID_FROM_EMAIL:}}

# ==========================================
# FRONTEND / CORS
# ==========================================
app.frontend.url=${FRONTEND_URL}

# ==========================================
# MULTIPART FILE UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}

# ==========================================
# JINA EMBEDDINGS
# ==========================================
spring.ai.openai.embedding.base-url=${JINA_BASE_URL}
spring.ai.openai.embedding.api-key=${JINA_API_KEY}
spring.ai.openai.embedding.options.model=${JINA_MODEL}

# ==========================================
# GROQ AI
# ==========================================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${GROQ_BASE_URL}
spring.ai.openai.chat.options.model=${GROQ_MODEL}

# ==========================================
# GOOGLE OAUTH / GMAIL
# ==========================================
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URL}
google.scope=${GOOGLE_GMAIL_SCOPE}
google.auth.uri=${GOOGLE_AUTH_URL}

# ==========================================
# ZOOM OAUTH
# ==========================================
zoom.client.id=${ZOOM_CLIENT_ID}
zoom.client.secret=${ZOOM_CLIENT_SECRET}
zoom.redirect.uri=${ZOOM_REDIRECT_URL}
zoom.scope=${ZOOM_SCOPES}
zoom.auth.uri=${ZOOM_AUTH_URL}
